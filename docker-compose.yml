version: '3.9'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8080/api}
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-}
    container_name: jobaggregator-frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8080/api}
      - NEXT_PUBLIC_API_KEY=${NEXT_PUBLIC_API_KEY:-}
    depends_on:
      - backend
    networks:
      - jobagg-net
    restart: unless-stopped

  backend:
    image: node:20-alpine
    container_name: jobaggregator-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm ci && npm start"
    ports:
      - '8080:8080'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/jobaggregator}
      - JWT_SECRET=${JWT_SECRET:-changeme}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-changeme_refresh}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jobagg-net
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: jobaggregator-db
    environment:
      POSTGRES_DB: jobaggregator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jobagg-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  jobagg-net:
    driver: bridge
