name: CI

on:
  push:
    branches: "*"
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobaggregator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Installer Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Installer les dépendances
        working-directory: ./BACKEND
        run: npm install

      - name: Vérifier le format Prettier
        working-directory: ./BACKEND
        run: npm run format:check

      - name: Lancer les migrations
        working-directory: ./BACKEND
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobaggregator_test

      - name: Lancer les tests Jest
        working-directory: ./BACKEND
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobaggregator_test